<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanSurface AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07100f;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.caixa{
  width:90%;
  max-width:600px;
  background:#0d1c1a;
  border:1px solid #1d3833;
  border-radius:20px;
  padding:35px;
  text-align:center;
  box-shadow:0 0 30px #0008;
}

h1{
  color:#39e6a3;
  margin-bottom:10px;
}

p{
  color:#b9cbc7;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #31534c;
  background:#07100f;
  color:white;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:10px;
  background:#39e6a3;
  color:#06100d;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.85;
}

#status{
  margin-top:25px;
  padding:15px;
  border-radius:10px;
  background:#07100f;
  color:#39e6a3;
  min-height:50px;
}

.resultado{
  margin-top:15px;
  padding:15px;
  border-radius:10px;
  background:#102723;
  display:none;
}
</style>
</head>

<body>

<div class="caixa">

  <h1>CleanSurface AI</h1>

  <p>
    Sistema inteligente de análise utilizando ESP32-S3-CAM.
  </p>

  <input
    type="email"
    id="email"
    placeholder="Digite seu e-mail"
  >

  <button onclick="iniciarAnalise()">
    🔍 INICIAR ANÁLISE
  </button>

  <div id="status">
    Aguardando análise...
  </div>

  <div id="resultado" class="resultado"></div>

</div>

<script>

const API =
"https://cleansurface-api.luizinfernando19.workers.dev";

let analiseId = null;

async function iniciarAnalise(){

  const email =
    document.getElementById("email").value;

  const status =
    document.getElementById("status");

  const resultado =
    document.getElementById("resultado");

  if(!email){

    status.innerText =
      "Digite seu e-mail primeiro.";

    return;
  }

  status.innerText =
    "⏳ Solicitando análise...";

  resultado.style.display = "none";

  try{

    const resposta = await fetch(
      API + "/iniciar-analise",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:email
        })
      }
    );

    const dados = await resposta.json();

    if(!dados.analise_id){

      status.innerText =
        "❌ Erro ao iniciar análise.";

      return;
    }

    analiseId = dados.analise_id;

    status.innerText =
      "📷 Aguardando ESP32-S3-CAM...";

    verificarResultado();

  }catch(erro){

    status.innerText =
      "❌ Erro de conexão com a API.";

    console.error(erro);
  }
}


async function verificarResultado(){

  if(!analiseId) return;

  try{

    const resposta = await fetch(
      API + "/resultado?analise_id=" + analiseId
    );

    const dados = await resposta.json();

    if(
      dados.disponivel === true &&
      dados.analise_id == analiseId
    ){

      document.getElementById("status").innerText =
        "✅ Análise concluída!";

      const resultado =
        document.getElementById("resultado");

      resultado.style.display = "block";

      resultado.innerHTML =
        "<b>Resultado:</b><br>" +
        (dados.valor || "Resultado recebido") +
        "<br><br>" +
        (dados.detalhe || "");

      return;
    }

  }catch(erro){

    console.log("Aguardando resultado...");
  }

  setTimeout(verificarResultado,3000);
}

</script>

</body>
</html>
