<!-- CONFIGURAÇÕES -->

<section id="configuracoes" class="page">

  <div class="section-card big">

    <div class="section-head">

      <div>

        <p class="eyebrow">NOTIFICAÇÕES</p>

        <h3>Configurações</h3>

        <p>
          Escolha onde deseja receber o resultado da análise.
        </p>

      </div>

    </div>

    <div class="settings">

      <label>
        Como deseja receber o resultado?

        <select id="canalNotificacao">
          <option value="whatsapp">📱 WhatsApp</option>
          <option value="email">✉️ E-mail</option>
          <option value="ambos">📱 WhatsApp + ✉️ E-mail</option>
        </select>

      </label>

      <label id="campoWhatsapp">

        Número do WhatsApp

        <input
          type="tel"
          id="whatsapp"
          placeholder="+55 (00) 00000-0000"
          maxlength="19">

        <small>
          Informe o número que receberá as notificações.
        </small>

      </label>

      <label id="campoEmail" style="display:none;">

        E-mail

        <input
          type="email"
          id="email"
          placeholder="seuemail@exemplo.com">

      </label>

      <label>

        Nível mínimo para alerta

        <input
          type="number"
          id="nivelAlerta"
          min="0"
          max="100"
          value="70">

      </label>

      <button
        class="primary"
        onclick="saveSettings()">

        💾 Salvar configurações

      </button>

      <span id="saved" class="saved"></span>

    </div>

  </div>

</section>

  <script src="script.js"></script>

</body>
</html>
